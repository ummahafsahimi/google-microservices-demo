name: Build, Push & Update GitOps

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/ci.yaml"

jobs:
  build-push-update-gitops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # fetches current + previous commit so HEAD~1 exists

      # -------------------------------
      # Authenticate to Google Cloud (WIF)
      # -------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "cicd-sa@ecommerce-platform-automation.iam.gserviceaccount.com"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker northamerica-northeast2-docker.pkg.dev

      # -------------------------------
      # Detect which microservice changed
      # -------------------------------
      - name: Detect changed microservice
        id: detect
        run: |
          SERVICE=$(git diff --name-only HEAD~1 HEAD | grep '^src/' | cut -d'/' -f2 | head -n 1)
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "Detected service: $SERVICE"
          
          echo "=== changed files ==="
          git diff --name-only HEAD~1 HEAD
          echo "=== grep result ==="
          git diff --name-only HEAD~1 HEAD | grep '^src/'
          echo "=== service ==="
          SERVICE=$(git diff --name-only HEAD~1 HEAD | grep '^src/' | cut -d'/' -f2 | head -n 1)
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "Detected service: $SERVICE"

      # -------------------------------
      # Build Docker image
      # -------------------------------
      - name: Build Docker image
        run: |
          SERVICE=${{ steps.detect.outputs.service }}
          IMAGE="northamerica-northeast2-docker.pkg.dev/ecommerce-platform-automation/inventory-registry/${SERVICE}:${{ github.sha }}"
          echo "Building image: $IMAGE"
          docker build -t $IMAGE src/$SERVICE

      # -------------------------------
      # Push Docker image
      # -------------------------------
      - name: Push Docker image
        run: |
          SERVICE=${{ steps.detect.outputs.service }}
          IMAGE="northamerica-northeast2-docker.pkg.dev/ecommerce-platform-automation/inventory-registry/${SERVICE}:${{ github.sha }}"
          echo "Pushing image: $IMAGE"
          docker push $IMAGE

      # -------------------------------
      # Clone GitOps repo
      # -------------------------------
      - name: Clone GitOps repo
        run: |
          git clone https://github.com/ummahafsahimi/A-Cloude-Native-SaaS-Platform-with-Full-DevOps-Automation.git gitops
          cd gitops
          git checkout gitOps

      # -------------------------------
      # Map service → values file & update appVersion
      # -------------------------------
      - name: Update GitOps values file
        run: |
          SERVICE=${{ steps.detect.outputs.service }}
          SHA=${{ github.sha }}
          cd gitops

          case "$SERVICE" in
            adservice)                VALUES_FILE="values/ad-service-values.yaml" ;;
            cartservice)              VALUES_FILE="values/cart-service-values.yaml" ;;
            checkoutservice)          VALUES_FILE="values/checkout-service-values.yaml" ;;
            currencyservice)          VALUES_FILE="values/currency-service-values.yaml" ;;
            emailservice)             VALUES_FILE="values/email-service-values.yaml" ;;
            frontend)                 VALUES_FILE="values/frontend-values.yaml" ;;
            paymentservice)           VALUES_FILE="values/payment-service-values.yaml" ;;
            productcatalogservice)    VALUES_FILE="values/productcatalog-service-values.yaml" ;;
            recommendationservice)    VALUES_FILE="values/recommendation-service-values.yaml" ;;
            shippingservice)          VALUES_FILE="values/shipping-service-values.yaml" ;;
            *)
              echo "Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          echo "Updating $VALUES_FILE with appVersion: $SHA"
          sed -i "s/^appVersion: .*/appVersion: \"${SHA}\"/" "$VALUES_FILE"

      # -------------------------------
      # Commit & push GitOps changes
      # -------------------------------
      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.email "ci-bot@github.com"
          git config user.name "GitHub Actions CI"
          git add values/*.yaml
          git commit -m "Update ${{ steps.detect.outputs.service }} appVersion to ${{ github.sha }}" || echo "No changes to commit"
          git push origin gitOps || echo "No changes pushed"

